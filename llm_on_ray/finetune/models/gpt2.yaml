General:
  base_model: gpt2
  gpt_base_model: true
  output_dir: /tmp/llm-ray/output
  save_strategy: no
  config:
    trust_remote_code: false
    use_auth_token: null

  # OPTIONAL: If you're not using LoRA, disable it
  lora_config: null

  enable_gradient_checkpointing: false

Dataset:
  train_file: examples/data/sample_finetune_data_small.jsonl
  validation_file: null
  validation_split_percentage: 5

Training:
  optimizer: adamw_torch
  batch_size: 2
  epochs: 3
  learning_rate: 1.0e-05
  lr_scheduler: linear
  weight_decay: 0.0

  # ❌ bf16 is NOT supported on CPU — use float32
  mixed_precision: "no"

  # ✅ Force CPU usage
  device: cpu

  # ✅ Only one worker — you have a CPU, not a cluster
  num_training_workers: 1

  resources_per_worker:
    CPU: 2

  accelerate_mode: "NO"  # Avoid DDP / multi-GPU distributed training

  gradient_accumulation_steps: 1
  logging_steps: 10
